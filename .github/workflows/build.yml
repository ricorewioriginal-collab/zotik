name: Publish Zotik Web

on:
  push:
    branches: [main]
    paths:
      - 'zotik/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zotik-pages
  cancel-in-progress: true

jobs:
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir -p site/zotik-old site/zotik-2.0
          cp zotik/index.html site/index.html
          printf '%s\n' '<!doctype html><html lang="de"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../"><title>Zotik</title><a href="../">Neues Zotik spielen</a></html>' > site/zotik-2.0/index.html
          printf '%s\n' '<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zotik-Archiv</title><body style="max-width:40rem;margin:3rem auto;padding:1rem;font:1.1rem/1.5 system-ui,sans-serif;background:#101827;color:#f6f6f3"><h1>Altes Zotik (Archiv)</h1><p>Die frühere Godot-Version wird nicht mehr automatisch gebaut.</p><p><a style="color:#9de4e8" href="https://github.com/ricorewioriginal-collab/zotik/releases/tag/phase1-latest">Letzten Build herunterladen</a> · <a style="color:#9de4e8" href="../">Neues Zotik spielen</a></p></body></html>' > site/zotik-old/index.html
          test -s site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
