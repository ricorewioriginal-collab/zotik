server {
	listen 80 default_server;
	server_name _;
	root /var/www/zotik;
	index index.html;
	location / { try_files $uri $uri/ =404; }
	# the "latest" link changes with every release: never cache the info and the page
	location = /latest/latest.json { add_header Cache-Control "no-store"; }
	location = / { add_header Cache-Control "no-store"; }
	location ~ \.apk$ { default_type application/vnd.android.package-archive; }
	autoindex off;
}
